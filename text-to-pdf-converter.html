<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to PDF Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
            resize: vertical;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        textarea {
            min-height: 300px;
            line-height: 1.6;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .option-group {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #e1e5e9;
        }

        .option-group label {
            margin-bottom: 10px;
            font-size: 0.95em;
            color: #555;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            transition: all 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(245, 87, 108, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .status.success {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
        }

        .status.error {
            background: linear-gradient(135deg, #ff9a8b, #ffecd2);
            color: #d63384;
        }

        .preview {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px dashed #dee2e6;
            display: none;
        }

        .preview h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .preview-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            font-family: 'Times New Roman', serif;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .options {
                grid-template-columns: 1fr;
            }
            
            .btn-container {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 Text to PDF Converter</h1>
            <p>Convert your text into professional PDF documents instantly</p>
        </div>

        <form id="pdfForm">
            <div class="form-group">
                <label for="filename">📝 PDF Filename:</label>
                <input type="text" id="filename" placeholder="Enter filename (without .pdf extension)" value="document">
            </div>

            <div class="form-group">
                <label for="textInput">✍️ Enter your text:</label>
                <textarea id="textInput" placeholder="Type or paste your text here...">Welcome to our Text to PDF Converter!

This is a sample text that demonstrates how your content will appear in the PDF document. You can:

• Write multiple paragraphs
• Include line breaks
• Add special characters and symbols
• Use different formatting styles

Simply replace this text with your own content and click the "Generate PDF" button below to create your downloadable PDF document.

Thank you for using our converter!</textarea>
            </div>

            <div class="options">
                <div class="option-group">
                    <label for="fontSize">📏 Font Size:</label>
                    <select id="fontSize">
                        <option value="10">10pt</option>
                        <option value="12" selected>12pt</option>
                        <option value="14">14pt</option>
                        <option value="16">16pt</option>
                        <option value="18">18pt</option>
                        <option value="20">20pt</option>
                    </select>
                </div>

                <div class="option-group">
                    <label for="pageSize">📋 Page Size:</label>
                    <select id="pageSize">
                        <option value="a4" selected>A4</option>
                        <option value="letter">Letter</option>
                        <option value="legal">Legal</option>
                        <option value="a3">A3</option>
                    </select>
                </div>

                <div class="option-group">
                    <label for="orientation">🔄 Orientation:</label>
                    <select id="orientation">
                        <option value="portrait" selected>Portrait</option>
                        <option value="landscape">Landscape</option>
                    </select>
                </div>

                <div class="option-group">
                    <label for="margin">📐 Margins:</label>
                    <select id="margin">
                        <option value="small">Small (0.5in)</option>
                        <option value="normal" selected>Normal (1in)</option>
                        <option value="large">Large (1.5in)</option>
                    </select>
                </div>
            </div>

            <div class="btn-container">
                <button type="button" id="generateBtn" class="btn-primary">
                    🚀 Generate PDF
                </button>
                <button type="button" id="previewBtn" class="btn-secondary">
                    👁️ Preview
                </button>
            </div>
        </form>

        <div id="status" class="status"></div>

        <div id="preview" class="preview">
            <h3>📖 Document Preview:</h3>
            <div id="previewContent" class="preview-content"></div>
        </div>
    </div>

    <script>
        // Get DOM elements
        const generateBtn = document.getElementById('generateBtn');
        const previewBtn = document.getElementById('previewBtn');
        const textInput = document.getElementById('textInput');
        const filenameInput = document.getElementById('filename');
        const fontSizeSelect = document.getElementById('fontSize');
        const pageSizeSelect = document.getElementById('pageSize');
        const orientationSelect = document.getElementById('orientation');
        const marginSelect = document.getElementById('margin');
        const statusDiv = document.getElementById('status');
        const previewDiv = document.getElementById('preview');
        const previewContent = document.getElementById('previewContent');

        // Show status message
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }

        // Get margin values in inches
        function getMarginValue(marginType) {
            const margins = {
                'small': 0.5,
                'normal': 1,
                'large': 1.5
            };
            return margins[marginType] || 1;
        }

        // Convert inches to PDF units (72 units per inch)
        function inchesToUnits(inches) {
            return inches * 72;
        }

        // Preview function
        function previewText() {
            const text = textInput.value.trim();
            
            if (!text) {
                showStatus('Please enter some text to preview', 'error');
                return;
            }

            previewContent.textContent = text;
            previewContent.style.fontSize = fontSizeSelect.value + 'px';
            previewDiv.style.display = 'block';
            
            // Scroll to preview
            previewDiv.scrollIntoView({ behavior: 'smooth' });
        }

        // PDF generation function
        function generatePDF() {
            const text = textInput.value.trim();
            const filename = filenameInput.value.trim() || 'document';
            
            if (!text) {
                showStatus('Please enter some text to convert', 'error');
                return;
            }

            try {
                // Disable button during generation
                generateBtn.disabled = true;
                generateBtn.textContent = '⏳ Generating...';

                // Get settings
                const fontSize = parseInt(fontSizeSelect.value);
                const pageSize = pageSizeSelect.value.toLowerCase();
                const orientation = orientationSelect.value;
                const marginValue = getMarginValue(marginSelect.value);
                const margin = inchesToUnits(marginValue);

                // Create new PDF document
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({
                    orientation: orientation,
                    unit: 'pt',
                    format: pageSize
                });

                // Get page dimensions
                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();
                
                // Calculate content area
                const contentWidth = pageWidth - (2 * margin);
                const contentHeight = pageHeight - (2 * margin);

                // Set font
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(fontSize);

                // Split text into lines that fit within the content width
                const lines = doc.splitTextToSize(text, contentWidth);
                
                // Calculate line height
                const lineHeight = fontSize * 1.2;
                
                // Add text to PDF with proper pagination
                let yPosition = margin + fontSize;
                let currentPage = 1;

                for (let i = 0; i < lines.length; i++) {
                    // Check if we need a new page
                    if (yPosition + lineHeight > pageHeight - margin) {
                        doc.addPage();
                        currentPage++;
                        yPosition = margin + fontSize;
                    }

                    // Add the line of text
                    doc.text(lines[i], margin, yPosition);
                    yPosition += lineHeight;
                }

                // Add metadata
                doc.setProperties({
                    title: filename,
                    creator: 'Text to PDF Converter',
                    creationDate: new Date()
                });

                // Generate PDF as blob
                const pdfBlob = doc.output('blob');
                
                // Create download link
                const url = URL.createObjectURL(pdfBlob);
                const downloadLink = document.createElement('a');
                downloadLink.href = url;
                downloadLink.download = filename.endsWith('.pdf') ? filename : filename + '.pdf';
                
                // Trigger download
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                
                // Clean up
                URL.revokeObjectURL(url);
                
                showStatus(`PDF "${downloadLink.download}" generated successfully! Check your downloads folder.`, 'success');

            } catch (error) {
                console.error('PDF generation error:', error);
                showStatus('Error generating PDF. Please try again.', 'error');
            } finally {
                // Re-enable button
                generateBtn.disabled = false;
                generateBtn.textContent = '🚀 Generate PDF';
            }
        }

        // Event listeners
        generateBtn.addEventListener('click', generatePDF);
        previewBtn.addEventListener('click', previewText);

        // Allow Enter key in textarea but not form submission
        textInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                generatePDF();
            }
        });

        // Auto-resize textarea
        textInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.max(300, this.scrollHeight) + 'px';
        });

        // Initial setup
        document.addEventListener('DOMContentLoaded', function() {
            textInput.focus();
            showStatus('Ready to convert text to PDF!', 'success');
        });
    </script>
</body>
</html>
